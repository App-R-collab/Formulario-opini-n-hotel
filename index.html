<!DOCTYPE html> <!-- Le dice al navegador que estamos usando HTML5 -->

<html lang="en"> <!-- Elemento raíz del documento; lang="en" indica que el idioma es inglés -->

  <head> <!-- Contiene información sobre la página que no se muestra directamente -->
    <meta charset="UTF-8" /> <!-- Permite utilizar caracteres especiales como á, é, ñ -->
    <title>Hotel Feedback Form</title> <!-- Título que aparece en la pestaña del navegador -->
  </head> <!-- Cierra el head -->

  <body> <!-- Contiene todo el contenido visible de la página -->

    <header> <!-- Cabecera de la página -->
      <h1>Hotel Feedback Form</h1> <!-- Encabezado principal de la página -->

      <p> <!-- Comienza un párrafo -->
        Thank you for staying with us. Please provide feedback on your recent
        stay. <!-- Texto del párrafo -->
      </p> <!-- Cierra el párrafo -->

    </header> <!-- Cierra la cabecera -->

    <main> <!-- Contenido principal de la página -->

      <form method="POST" action="https://hotel-feedback.freecodecamp.org">
        <!-- Crea el formulario; POST indica cómo se envían los datos y action indica dónde se envían -->

        <fieldset> <!-- Agrupa elementos relacionados del formulario -->

          <legend>Personal Information</legend> <!-- Título del grupo de elementos -->

          <label for="full-name">Name (required):</label>
          <!-- Etiqueta que describe el campo de nombre; for se conecta con el id del input -->

          <input type="text" id="full-name" name="name" placeholder="e.g., John Doe" required size="20">
          <!-- Campo de texto; id identifica el elemento, name identifica el dato enviado,
               placeholder muestra un ejemplo, required lo hace obligatorio y size define su tamaño -->

          <label for="email">Email address (required):</label>
          <!-- Etiqueta que describe el campo de correo -->

          <input
            placeholder="example@email.com"
            required
            id="email"
            type="email"
            name="email"
            size="20"
          />
          <!-- Campo para correo electrónico; type="email" indica que espera un email -->

          <label for="age">Age (optional):</label>
          <!-- Etiqueta que describe el campo de edad -->

          <input type="number" name="age" id="age" min="3" max="100" />
          <!-- Campo numérico; permite valores desde 3 hasta 100 -->

        </fieldset> <!-- Cierra el grupo Personal Information -->


        <fieldset> <!-- Comienza otro grupo del formulario -->

          <legend>Was this your first time at our hotel?</legend>
          <!-- Título/pregunta del grupo -->

          <input id="yes-option" type="radio" name="hotel-stay" value="yes" />
          <!-- Botón radio; permite seleccionar una opción del grupo -->

          <label for="yes-option">Yes</label>
          <!-- Texto asociado al botón Yes -->

          <input id="no-option" type="radio" name="hotel-stay" value="no" />
          <!-- Segundo botón radio; comparte name con el anterior para formar un mismo grupo -->

          <label for="no-option">No</label>
          <!-- Texto asociado al botón No -->

        </fieldset> <!-- Cierra el grupo de primera visita -->


        <fieldset> <!-- Comienza el grupo de razones -->

          <legend>
            Why did you choose to stay at our hotel? (Check all that apply)
          </legend>
          <!-- Pregunta que permite seleccionar varias respuestas -->


          <input type="checkbox" id="ads" name="choice" value="ads" />
          <!-- Casilla de selección; checkbox permite seleccionar varias opciones -->

          <label for="ads">Social Media Ads</label>
          <!-- Texto asociado a la casilla -->

          <input
            type="checkbox"
            id="recommendation"
            name="choice"
            value="recommendation"
          />
          <!-- Segunda casilla de selección -->

          <label for="recommendation">Personal Recommendation</label>
          <!-- Texto asociado a la segunda casilla -->

          
          <input type="checkbox" id="location" name="choice" value="location" />
          <!-- Casilla para seleccionar Location -->

          <label for="location">Location</label>
          <!-- Texto asociado a Location -->


          <input
            checked
            type="checkbox"
            id="reputation"
            name="choice"
            value="reputation"
          />
          <!-- Casilla para Reputation; checked hace que aparezca marcada inicialmente -->

          <label for="reputation">Reputation</label>
          <!-- Texto asociado a Reputation -->

          
          <input type="checkbox" id="price" name="choice" value="price" />
          <!-- Casilla para seleccionar Price -->

          <label for="price">Price</label>
          <!-- Texto asociado a Price -->

        </fieldset> <!-- Cierra el grupo de razones -->


        <fieldset> <!-- Comienza el grupo de calificaciones -->

          <legend>Ratings</legend>
          <!-- Título del grupo de calificaciones -->


          <label for="service">How was the service?</label>
          <!-- Pregunta sobre el servicio -->


          <select name="service" id="service">
            <!-- Crea un menú desplegable -->

            <option value="poor">Poor</option>
            <!-- Opción Poor; value es el valor que se enviará -->

            <option value="satisfactory">Satisfactory</option>
            <!-- Opción Satisfactory -->

            <option value="good">Good</option>
            <!-- Opción Good -->

            <option value="very-good">Very Good</option>
            <!-- Opción Very Good -->

            <option selected value="excellent">Excellent</option>
            <!-- Opción Excellent; selected hace que aparezca seleccionada inicialmente -->

          </select> <!-- Cierra el menú desplegable -->


          <label for="food">How was the food?</label>
          <!-- Pregunta sobre la comida -->


          <select name="food" id="food">
            <!-- Crea otro menú desplegable -->

            <option value="poor">Poor</option>
            <!-- Opción Poor -->

            <option value="satisfactory">Satisfactory</option>
            <!-- Opción Satisfactory -->

            <option value="good">Good</option>
            <!-- Opción Good -->

            <option value="very-good">Very Good</option>
            <!-- Opción Very Good -->

            <option selected value="excellent">Excellent</option>
            <!-- Opción Excellent seleccionada inicialmente -->

          </select> <!-- Cierra el menú de comida -->

        </fieldset> <!-- Cierra el grupo Ratings -->


        <label for="comments">Other Comments?</label>
        <!-- Etiqueta para el campo de comentarios -->

        <textarea cols="30" rows="10" name="comments" id="comments"></textarea>
        <!-- Área de texto; cols define el ancho aproximado y rows la altura -->


      <button type="submit">Submit</button>
      <!-- Botón que envía el formulario -->

      </form> <!-- Cierra el formulario -->

    </main> <!-- Cierra el contenido principal -->

  </body> <!-- Cierra el contenido visible -->

</html> <!-- Cierra el documento HTML -->
